name: CI
on: [push, pull_request]

jobs:
  secret-scan:
    name: Secret leak check (SEC-04)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Reject literal API keys in source
        run: |
          set -euo pipefail
          # SEC-04: reject literal API keys in Swift source, plists, and YAML.
          # The workflow file itself is excluded via --exclude to avoid self-reference.
          #
          # Patterns are LENGTH-GATED on each provider's real key suffix so the
          # scanner catches genuine leaked keys but NOT the bare prefixes and
          # short fixtures that legitimately appear in tests and doc comments
          # (e.g. `sk-or-v1-test`, or the prefix list in OnboardingCopy). A bare
          # `sk-or-` or `AIzaSy` substring is not a secret; only a prefix
          # followed by a full-length random suffix is.
          #   sk-or-v1- + 64 hex (OpenRouter)  -> require >=40 of the suffix
          #   AIzaSy    + 33 chars (Google)     -> require >=30
          #   sk-proj-/sk-admin- + long (OpenAI)-> require >=20
          #   generic sk-<48 alnum> (OpenAI)    -> require >=32 contiguous alnum
          PATTERNS='sk-or-v1-[A-Za-z0-9]{40,}|AIzaSy[A-Za-z0-9_-]{30,}|sk-proj-[A-Za-z0-9_-]{20,}|sk-admin-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{32,}'
          # GeminiOAuthClient.swift no longer carries gemini-cli client_id /
          # client_secret literals — those are injected via environment
          # variables resolved by AppDependencies (see docs/gemini-setup.md).
          # The file participates in the SEC-04 grep like everything else.
          if grep -RIEn --include='*.swift' --include='*.plist' --include='*.yml' \
                     --exclude='ci.yml' \
                     "$PATTERNS" \
                     AgentsUsageBar/ AgentsUsageBarTests/ .github/ ; then
            echo "ERROR: Source contains literal API key prefixes. See SEC-04."
            exit 1
          fi
          echo "OK: No literal API key prefixes in source."

  cfg-06-check:
    name: CFG-06 — no shell RC file references
    runs-on: macos-15
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4
      - name: CFG-06 — no shell RC file references in source
        run: |
          set -euo pipefail
          # CFG-06: shell RC file references MUST NOT appear in non-comment Swift source.
          # Rationale: env vars read via ProcessInfo.environment only; shell RC files
          # are a code-execution vector and explicitly forbidden (05-CONTEXT.md CFG-06 anti-feature).
          # Self-reference guard: search path is AgentsUsageBar/ only — ci.yml lives in
          # .github/workflows/ and is outside the search path (no --exclude needed).
          # Comment-line filter: doc-comment lines (/// or //) that name the forbidden
          # paths as prohibition documentation are intentional and must not trigger.
          # grep -v '^[[:space:]]*//' removes lines whose first non-space content is //.
          VIOLATIONS=$(grep -RIn \
               --include='*.swift' \
               --exclude-dir='.build' \
               --exclude-dir='DerivedData' \
               -e '\.zshrc' \
               -e '\.bashrc' \
               -e 'config\.fish' \
               AgentsUsageBar/ \
            | grep -v '^[^:]*:[0-9]*:[[:space:]]*//' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "CFG-06 violation: shell RC file reference found in non-comment source:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "OK: No shell RC file references in non-comment source."

  test:
    name: Build and test
    runs-on: macos-15
    needs: [secret-scan, cfg-06-check]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Show xcodebuild version
        run: xcodebuild -version
      - name: Run tests
        run: |
          # -testPlan AgentsUsageBar selects the shared test plan, which disables Swift
          # Testing's in-process parallelism (parallelizable=false). The suite has @MainActor
          # stores (PollScheduler/PowerObserver) whose refresh hops starve under 16-way parallel
          # MainActor contention, causing timing flakes; serial execution removes that
          # contention. (Issue #4 — the `Build and test` job's pre-existing flakes.)
          xcodebuild test \
            -project AgentsUsageBar.xcodeproj \
            -scheme AgentsUsageBar \
            -testPlan AgentsUsageBar \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

  # Phase 6 Plan 06-04 (REL-08 / REL-09) — entitlement / Hardened-Runtime /
  # Sandbox regression guard. Intentionally reads SOURCE plists + pbxproj,
  # not a signed artifact, so it runs on every push/PR WITHOUT requiring
  # any Apple credentials (Developer ID cert, ASC API key, etc.). The
  # signed-artifact verification is deferred to plan 06-05's UAT once live
  # credentials exist.
  #
  # plutil -extract keypath note: the entitlement key
  # `com.apple.security.network.client` contains literal dots that plutil
  # would otherwise interpret as nested-keypath separators. Backslash-escape
  # each dot so plutil treats the whole string as a single top-level key.
  entitlements-guard:
    name: Entitlements + ATS + Hardened Runtime guard (REL-08/REL-09)
    runs-on: macos-15
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Assert REL-09 — only network.client entitlement is present
        run: |
          set -euo pipefail
          ENT=AgentsUsageBar/Resources/Entitlements.plist
          # (a) network.client MUST be true (REL-09 — Sparkle + provider HTTP).
          # Dots escaped because the key is literal, not a nested path.
          VAL=$(plutil -extract 'com\.apple\.security\.network\.client' raw "$ENT")
          if [ "$VAL" = "true" ]; then
            echo "OK (REL-09): com.apple.security.network.client = true"
          else
            echo "FAIL (REL-09): com.apple.security.network.client must be true in $ENT (got: $VAL)"
            exit 1
          fi
          # (b) Forbidden entitlements MUST be absent (REL-09 — least privilege)
          for forbidden in disable-library-validation allow-jit allow-dyld-environment-variables app-sandbox; do
            if grep -q "$forbidden" "$ENT"; then
              echo "FAIL (REL-09): forbidden entitlement '$forbidden' found in $ENT"
              exit 1
            fi
            echo "OK (REL-09): forbidden entitlement '$forbidden' is absent"
          done

      - name: Assert REL-08 — NSAllowsLocalNetworking is true in Info.plist
        run: |
          set -euo pipefail
          INFO=AgentsUsageBar/Resources/Info.plist
          # NSAppTransportSecurity is a dict; NSAllowsLocalNetworking is a
          # nested key — this IS a real nested keypath so the dot is the
          # path separator (no escape).
          VAL=$(plutil -extract NSAppTransportSecurity.NSAllowsLocalNetworking raw "$INFO")
          if [ "$VAL" = "true" ]; then
            echo "OK (REL-08): NSAppTransportSecurity.NSAllowsLocalNetworking = true"
          else
            echo "FAIL (REL-08): NSAppTransportSecurity.NSAllowsLocalNetworking must be true in $INFO (got: $VAL)"
            exit 1
          fi

      - name: Assert pbxproj — Hardened Runtime ON, App Sandbox OFF
        run: |
          set -euo pipefail
          PBXPROJ=AgentsUsageBar.xcodeproj/project.pbxproj
          # Hardened Runtime ENABLED (REL-09 prerequisite for notarization)
          if grep -q "ENABLE_HARDENED_RUNTIME = YES" "$PBXPROJ"; then
            echo "OK (REL-09): ENABLE_HARDENED_RUNTIME = YES in pbxproj"
          else
            echo "FAIL (REL-09): pbxproj must set ENABLE_HARDENED_RUNTIME = YES (notarization gate)"
            exit 1
          fi
          # App Sandbox DISABLED (D-08 — must read ~/.claude, ~/.codex,
          # ~/.gemini, ~/.ccs without security-scoped bookmarks)
          if grep -q "ENABLE_APP_SANDBOX = NO" "$PBXPROJ"; then
            echo "OK (REL-09): ENABLE_APP_SANDBOX = NO in pbxproj"
          else
            echo "FAIL (REL-09): pbxproj must set ENABLE_APP_SANDBOX = NO (DMG-only v1; sandbox would block dotfile reads)"
            exit 1
          fi
          # Sanity: assert ENABLE_HARDENED_RUNTIME is NEVER turned off anywhere
          if grep -q "ENABLE_HARDENED_RUNTIME = NO" "$PBXPROJ"; then
            echo "FAIL (REL-09): pbxproj contains ENABLE_HARDENED_RUNTIME = NO somewhere — must always be YES"
            exit 1
          fi
          # Sanity: assert ENABLE_APP_SANDBOX is NEVER turned on anywhere
          if grep -q "ENABLE_APP_SANDBOX = YES" "$PBXPROJ"; then
            echo "FAIL (REL-09): pbxproj contains ENABLE_APP_SANDBOX = YES somewhere — must always be NO (D-08)"
            exit 1
          fi
          # Issue #8 — Release must not gather LLVM coverage (instrumented
          # binaries dump default.profraw into the caller's cwd).
          if grep -q "CLANG_ENABLE_CODE_COVERAGE = YES" "$PBXPROJ"; then
            echo "FAIL (issue #8): pbxproj enables CLANG_ENABLE_CODE_COVERAGE — Release/shipped aub must not be instrumented"
            exit 1
          fi
          if grep -q "CLANG_COVERAGE_MAPPING = YES" "$PBXPROJ"; then
            echo "FAIL (issue #8): pbxproj enables CLANG_COVERAGE_MAPPING — that instruments Release binaries"
            exit 1
          fi
          if ! grep -q "CLANG_COVERAGE_MAPPING = NO" "$PBXPROJ"; then
            echo "FAIL (issue #8): pbxproj must set CLANG_COVERAGE_MAPPING = NO on Release"
            exit 1
          fi
          echo "OK (issue #8): Release coverage instrumentation is disabled"
