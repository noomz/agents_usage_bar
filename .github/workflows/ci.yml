name: CI
on: [push, pull_request]

jobs:
  secret-scan:
    name: Secret leak check (SEC-04)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Reject literal API keys in source
        run: |
          set -euo pipefail
          # SEC-04: reject literal API key prefixes in Swift source, plists, and YAML.
          # The workflow file itself is excluded via --exclude to avoid self-reference.
          PATTERNS='sk-proj-|sk-admin-|sk-or-|AIzaSy|sk-[A-Za-z0-9]{20,}'
          # GeminiOAuthClient.swift is excluded because it bundles the
          # gemini-cli OAuth2 client_id + client_secret. Per RFC 6749 §2.1
          # these are public for installed-app flows; the SEC-04 patterns
          # don't currently match them but the exclusion is kept for
          # forward-compatibility with future patterns (Plan 03-05).
          if grep -RIEn --include='*.swift' --include='*.plist' --include='*.yml' \
                     --exclude='ci.yml' \
                     --exclude='GeminiOAuthClient.swift' \
                     "$PATTERNS" \
                     AgentsUsageBar/ AgentsUsageBarTests/ .github/ ; then
            echo "ERROR: Source contains literal API key prefixes. See SEC-04."
            exit 1
          fi
          echo "OK: No literal API key prefixes in source."

  test:
    name: Build and test
    runs-on: macos-15
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Show xcodebuild version
        run: xcodebuild -version
      - name: Run tests
        run: |
          xcodebuild test \
            -project AgentsUsageBar.xcodeproj \
            -scheme AgentsUsageBar \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
